<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e0d14"/><stop offset=".55" stop-color="#12080c"/><stop offset="1" stop-color="#0a0507"/>
    </linearGradient>
    <linearGradient id="ring" x1="620" y1="150" x2="980" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#ff9a62"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#fff1f3"/><stop offset=".35" stop-color="#ff7a8f"/><stop offset="1" stop-color="#ff3b5c"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity=".42"/><stop offset="1" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a74"/><stop offset="1" stop-color="#ff9a62"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5b"/><stop offset="1" stop-color="#ff3b5c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#fff" stroke-opacity=".045"/></pattern>
    <radialGradient id="fade" cx=".5" cy=".5" r=".6"><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gridmask"><rect width="1600" height="640" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  
  <rect width="1600" height="640" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle cx="800" cy="320" r="330" fill="url(#halo)"/>

  <!-- orbit rings -->
  <g stroke="#ff8a5b" fill="none" class="orbits">
    <circle class="o1" cx="800" cy="320" r="236" stroke-opacity=".22" stroke-dasharray="3 12"/>
    <circle cx="800" cy="320" r="300" stroke-opacity=".14"/>
    <circle class="o3" cx="800" cy="320" r="372" stroke-opacity=".08" stroke-dasharray="2 10"/>
  </g>

  <!-- links from people to the orb -->
  <g stroke="url(#ring)" stroke-opacity=".5" stroke-width="1.5">
    <line x1="470" y1="150" x2="800" y2="320"/><line x1="330" y1="330" x2="800" y2="320"/><line x1="500" y1="520" x2="800" y2="320"/>
    <line x1="1130" y1="130" x2="800" y2="320"/><line x1="1290" y1="320" x2="800" y2="320"/><line x1="1110" y1="520" x2="800" y2="320"/>
  </g>

  <!-- the Cohle mark -->
  <path d="M928.7 212A168 168 0 1 0 928.7 428" stroke="url(#ring)" stroke-width="74" stroke-linecap="round" filter="url(#blur)" opacity=".55"/>
  <path d="M928.7 212A168 168 0 1 0 928.7 428" stroke="url(#ring)" stroke-width="74" stroke-linecap="round"/>
  <circle cx="938" cy="320" r="52" fill="#ff3b5c" filter="url(#soft)" opacity=".75"/>
  <circle cx="938" cy="320" r="45" fill="url(#orb)"/>

  <!-- people -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="25" text-anchor="middle" fill="#fff">
    <g class="fl a"><circle cx="470" cy="150" r="46" fill="url(#av)"/><text x="470" y="159">A</text></g>
    <g class="fl b"><circle cx="330" cy="330" r="40" fill="url(#av)"/><text x="330" y="338">B</text></g>
    <g class="fl c"><circle cx="500" cy="520" r="44" fill="url(#av)"/><text x="500" y="529">C</text></g>
    <g class="fl d"><circle cx="1130" cy="130" r="42" fill="url(#av)"/><text x="1130" y="139">D</text></g>
    <g class="fl e"><circle cx="1290" cy="320" r="48" fill="url(#av)"/><text x="1290" y="329">E</text></g>
    <g class="fl f"><circle cx="1110" cy="520" r="40" fill="url(#av)"/><text x="1110" y="528">F</text></g>
  </g>
  <!-- speaking rings -->
  <g stroke="#3ddc84" stroke-width="4" fill="none" class="pulse">
    <circle cx="470" cy="150" r="54"/><circle cx="1290" cy="320" r="56"/><circle cx="500" cy="520" r="52" stroke-opacity=".0"/>
  </g>
  <g stroke="#3ddc84" stroke-width="2" fill="none" stroke-opacity=".35"><circle cx="470" cy="150" r="64"/><circle cx="1290" cy="320" r="67"/></g>

  <!-- live card -->
  <g transform="translate(150 78)">
    <rect width="214" height="62" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <rect x="14" y="16" width="86" height="30" rx="15" fill="#ff3b5c"/>
    <rect x="28" y="25" width="18" height="12" rx="2" stroke="#fff" stroke-width="2"/><path d="M33 40h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="37" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="13" fill="#fff" letter-spacing="1">AO VIVO</text>
    <rect x="114" y="25" width="76" height="6" rx="3" fill="#fff" fill-opacity=".22"/><rect x="114" y="38" width="48" height="6" rx="3" fill="#fff" fill-opacity=".14"/>
  </g>
  <!-- voice card -->
  <g transform="translate(1230 468)">
    <rect width="236" height="70" rx="20" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <path d="M30 29v12M38 22v26M46 28v14M54 18v34M62 27v16M70 31v8" stroke="url(#bar)" stroke-width="5" stroke-linecap="round"/>
    <rect x="94" y="22" width="112" height="8" rx="4" fill="#fff" fill-opacity=".26"/><rect x="94" y="40" width="72" height="8" rx="4" fill="#fff" fill-opacity=".14"/>
  </g>

  <!-- sound bars -->
  <g fill="url(#bar)" opacity=".55" class="bars">
    <rect x="590" y="566" width="10" height="26" rx="5"/><rect x="618" y="552" width="10" height="54" rx="5"/><rect x="646" y="540" width="10" height="78" rx="5"/>
    <rect x="674" y="556" width="10" height="46" rx="5"/><rect x="702" y="546" width="10" height="66" rx="5"/><rect x="730" y="562" width="10" height="34" rx="5"/>
    <rect x="860" y="562" width="10" height="34" rx="5"/><rect x="888" y="546" width="10" height="66" rx="5"/><rect x="916" y="556" width="10" height="46" rx="5"/>
    <rect x="944" y="540" width="10" height="78" rx="5"/><rect x="972" y="552" width="10" height="54" rx="5"/><rect x="1000" y="566" width="10" height="26" rx="5"/>
  </g>
</svg>