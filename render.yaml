# Render Blueprint: New > Blueprint > pick this repository. Only the API runs on Render (it has no UDP, which
# voice/video needs), so the database and LiveKit are external. See docs/render.md.
services:
  - type: web
    name: cohle-api
    runtime: docker
    plan: free
    region: virginia           # same region as the Supabase database (AWS us-east-1): fewer ms per query
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:                 # redeploy only when the API (or what it is built from) changes, not for landing/docs edits
      paths:
        - apps/server/**
        - packages/shared/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY          # Render sits behind a proxy: rate limits must use the real client IP
        value: "1"
      - key: JWT_SECRET           # random, generated once by Render
        generateValue: true
      - key: DATABASE_URL         # Supabase Session pooler string, port 5432 (you paste it in the dashboard)
        sync: false
      - key: LIVEKIT_URL          # wss://<project>.livekit.cloud
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
